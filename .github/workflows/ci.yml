name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build release
        run: swift build -c release
      - name: Verify distributable package
        run: bash Scripts/verify-package.sh
